name: Bug Report
description: Report a bug or issue with Vertex Toolkit
title: "[Bug] "
labels: ["bug", "needs-triage"]
assignees:
  - jhonbergmann

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us understand and reproduce the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce the issue.
      placeholder: |
        1. Install vertex-toolkit
        2. Import { validations } from 'vertex-toolkit'
        3. Call validations.isValidCPF('123.456.789-09')
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The function should return true for valid CPF...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: The function throws an error...
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code Sample
      description: Please provide a minimal code sample that reproduces the issue.
      render: typescript
      placeholder: |
        import { validations } from 'vertex-toolkit';
        
        // Your code here
        const result = validations.isValidCPF('123.456.789-09');
        console.log(result); // Expected: true, Actual: error

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: What environment are you running in?
      options:
        - Browser
        - Node.js
        - React
        - React Native
        - Next.js
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      description: What version of vertex-toolkit are you using?
      placeholder: "1.0.4"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you using? (if applicable)
      placeholder: "18.17.0"

  - type: input
    id: browser
    attributes:
      label: Browser
      description: What browser are you using? (if applicable)
      placeholder: "Chrome 118.0"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, logs, etc.)
      placeholder: Any additional information...