name: Test Release

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Test version (e.g., 1.0.6)'
        required: true
        default: '1.0.6'

permissions:
  contents: write

jobs:
  test-release:
    name: Test Release Process
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Run type check
      run: npm run type-check
      
    - name: Verify package contents
      run: npm pack --dry-run
      
    - name: Test summary
      run: |
        echo "## ✅ Test Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build**: ✅ Successful" >> $GITHUB_STEP_SUMMARY
        echo "- **Type Check**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
        echo "- **Package Verification**: ✅ Ready" >> $GITHUB_STEP_SUMMARY
        echo "- **Test Version**: ${{ github.event.inputs.test_version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🚀 **Ready for actual release!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "To create a real release:" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to Actions → Auto Version & Release" >> $GITHUB_STEP_SUMMARY
        echo "2. Choose version type (patch/minor/major)" >> $GITHUB_STEP_SUMMARY
        echo "3. Add release notes" >> $GITHUB_STEP_SUMMARY
        echo "4. Run workflow" >> $GITHUB_STEP_SUMMARY